[project]
name = "flowchart-ai"
version = "1.3.0"
description = "自然语言生成 Mermaid 流程图的循环式 Agent（生成 → 渲染校验 → 视觉验证 → 反馈修复）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
]

[project.scripts]
flowchart-agent = "flowchart_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowchart_agent"]
